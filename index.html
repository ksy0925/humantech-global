<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="vHF6X-P78ye1HWaZpXoS0mKrcKAnaBtzFiMDPex-jSo" />
    <title>Influence Hub | 인플루언서 마케팅의 시작</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">휴먼테크 글로벌</div>
            <ul class="nav-menu">
                <li><a href="#" class="active">인플루언서 검색</a></li>
                <li><a href="#">캠페인 목록</a></li>
                <li><a href="#">커뮤니티</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a href="#" class="nav-link">로그인</a>
            <button class="signup-btn">회원가입</button>
        </div>
    </nav>

    <header class="main-banner">
        <div class="banner-content">
            <h1>딱 맞는 인플루언서를<br>가장 빠르게 연결해 드립니다.</h1>
            <p>검증된 데이터로 마케팅 성과를 확인하세요.</p>
            <div class="search-bar">
                <input type="text" placeholder="관심 키워드나 인플루언서 이름을 검색해보세요.">
                <button><i class="fa fa-search"></i></button>
            </div>
        </div>
    </header>

    <div class="channel-tabs">
        <button class="tab active">전체</button>
        <button class="tab">인스타그램</button>
        <button class="tab">블로그</button>
        <button class="tab">유튜브</button>
    </div>

    <div class="container">
        <aside class="filter-section">
            <div class="filter-item">
                <h4>카테고리</h4>
                <ul>
                    <li><input type="checkbox" id="c1"> <label for="c1">뷰티/패션</label></li>
                    <li><input type="checkbox" id="c2"> <label for="c2">맛집/여행</label></li>
                    <li><input type="checkbox" id="c3"> <label for="c3">IT/테크</label></li>
                    <li><input type="checkbox" id="c4"> <label for="c4">생활/라이프</label></li>
                </ul>
            </div>
            <div class="filter-item">
                <h4>팔로워 규모</h4>
                <select>
                    <option>전체</option>
                    <option>1만 이하</option>
                    <option>1만 ~ 10만</option>
                    <option>10만 이상</option>
                </select>
            </div>
        </aside>

        <main class="content">
            <div class="list-header">
                <p>총 <strong>1,250명</strong>의 인플루언서</p>
            </div>
            <div id="influencer-grid" class="grid">
                </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
